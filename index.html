<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FFD21E'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='%23111827' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<title>Goal Tracker</title>
<style>
  :root {
    --sans: "Source Sans Pro","Source Sans 3",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono: "IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --bg: #ffffff; --header-bg: #ffffff; --card: #ffffff; --fill: #f9fafb;
    --border: #e5e7eb; --border-h: #d1d5db;
    --text: #111827; --text2: #4b5563; --muted: #9ca3af;
    --yellow: #FFD21E;
    --today-bg: #fffbeb; --today-head: #b45309;
    --track: #f3f4f6;
    --conn: #d1d5db; --done-cb: #16a34a; --ok: #22c55e;
    --linkchip-bg: #f3f4f6; --linkchip-c: #4b5563;
    --hl-ring: #93c5fd; --hl-bg: #eff6ff;
    --pop: #ffffff;
    --pop-shadow: 0 4px 12px rgba(0,0,0,.08);
    --dot-o: #d1d5db; --dot-h: #9ca3af;
    --cal-sel: #f9fafb; --cal-hov: #f9fafb;
    --h1: #9be9a8; --h2: #40c463; --h3: #30a14e; --h4: #216e39;
  }
  html.dark {
    --bg: #0b0f19; --header-bg: #0b0f19; --card: #111827; --fill: #0f1523;
    --border: #1f2937; --border-h: #374151;
    --text: #e5e7eb; --text2: #9ca3af; --muted: #6b7280;
    --today-bg: rgba(255,210,30,.06); --today-head: #fcd34d;
    --track: #1f2937;
    --conn: #374151;
    --linkchip-bg: #1f2937; --linkchip-c: #9ca3af;
    --hl-ring: #3b82f6; --hl-bg: rgba(30,58,138,.4);
    --pop: #111827;
    --pop-shadow: 0 4px 12px rgba(0,0,0,.4);
    --dot-o: #374151; --dot-h: #6b7280;
    --cal-sel: #0f1523; --cal-hov: #0f1523;
    --h1: #0e4429; --h2: #006d32; --h3: #26a641; --h4: #39d353;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 var(--sans); background: var(--bg); color: var(--text); }
  .mono { font-family: var(--mono); }
  .wrap { min-width: 0; width:100%; overflow-x:hidden; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; background: var(--header-bg); border-bottom: 1px solid var(--border); }
  .logo { width: 20px; height: 20px; border-radius: 5px; background: var(--yellow); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  h1 { font-size: 15px; font-weight: 700; color: var(--text); margin: 0; letter-spacing: -0.01em; }
  .switcher { display: flex; align-items: center; gap: 4px; }
  .wlabel { font-family: var(--mono); font-size: 13px; color: var(--text); min-width: 150px; text-align: center; }
  .gbtn { height: 28px; padding: 0 9px; border: 1px solid var(--border); border-radius: 6px; background: none; cursor: pointer; font-size: 12px; color: var(--text2); font-family: var(--sans); }
  .gbtn:hover { background: var(--fill); border-color: var(--border-h); }
  .gbtn:disabled { opacity: .4; cursor: default; }
  .spacer { flex: 1; }

  .menu-wrap, .cal-wrap { position: relative; }
  .menu { position: absolute; right: 0; top: 34px; z-index: 50; width: 176px; padding: 4px 0; background: var(--pop); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--pop-shadow); }
  .menu button { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 7px 12px; font-size: 13px; color: var(--text2); cursor: pointer; font-family: var(--sans); }
  .menu button:hover { background: var(--fill); }

  /* ---------- mini calendar ---------- */
  .calpop { position: absolute; right: 0; top: 34px; z-index: 50; width: 320px; padding: 10px; background: var(--pop); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--pop-shadow); }
  .calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .calhead .cm { font-size: 13px; font-weight: 600; color: var(--text); }
  .calgrid { display: grid; grid-template-columns: 34px repeat(6, 26px) 1fr; align-items: center; }
  .calgrid .ch { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: center; padding: 2px 0; }
  .calrow { display: contents; }
  .calrow > span { padding: 3px 0; text-align: center; font-size: 12px; }
  .calrow .wk { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: left; padding-left: 4px; }
  .calrow .cd { color: var(--text2); border-radius: 4px; display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; padding: 0; }
  .calrow .cd.out { opacity: .55; }
  .calrow .cd.today { font-weight: 700; color: var(--today-head); box-shadow: inset 0 0 0 2px var(--today-head); }
  .calrow .cd.h1 { background: var(--h1); }
  .calrow .cd.h2 { background: var(--h2); }
  .calrow .cd.h3 { background: var(--h3); color: #ffffff; }
  .calrow .cd.h4 { background: var(--h4); color: #ffffff; }
  html.dark .calrow .cd.h3, html.dark .calrow .cd.h4 { color: #111827; }
  html.dark .calrow .cd.h1, html.dark .calrow .cd.h2 { color: #ffffff; }
  .callegend { display: flex; justify-content: flex-end; align-items: center; gap: 3px; margin-top: 8px; font-size: 11px; color: var(--muted); }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .sw.h0 { border: 1px solid var(--dot-o); }
  .sw.h1 { background: var(--h1); }
  .sw.h2 { background: var(--h2); }
  .sw.h3 { background: var(--h3); }
  .sw.h4 { background: var(--h4); }
  .calrow .dots { display: flex; gap: 4px; padding-left: 8px; }
  .calrow:hover > span { background: var(--cal-hov); }
  .calrow.sel > span { background: var(--cal-sel); font-weight: 600; }
  .calrow { cursor: pointer; }
  .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--dot-o); display: inline-block; }
  .dot.half { background: var(--dot-h); border-color: var(--dot-h); }
  .dot.full { background: var(--ok); border-color: var(--ok); }
  .dashed.category { width: 224px; padding: 12px 0; font-size: 13px; }

  /* ---------- board ---------- */
  main { padding: 16px; }

  /* ---------- category sections ---------- */
  .cathead { display: flex; align-items: center; gap: 8px; padding: 6px 0; margin-bottom: 6px; border-bottom: 1px solid var(--border); }
  .catdot-wrap { position: relative; display: inline-flex; }
  .catdot { width: 10px; height: 10px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; flex-shrink: 0; }
  .catname { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; cursor: text; min-width: 0; overflow-wrap: break-word; }
  .catmeta { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
  .cathead button { white-space: nowrap; flex-shrink: 0; }
  .catsp { flex: 1; }
  .cathead .catdel { position: static; }
  .palette { position: absolute; left: 0; top: 16px; z-index: 45; display: grid; grid-template-columns: repeat(4, 18px); gap: 5px; padding: 6px; background: var(--pop); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--pop-shadow); }
  .palette button { width: 18px; height: 18px; border-radius: 4px; border: 1px solid rgba(0,0,0,.12); cursor: pointer; padding: 0; }
  .mtools { position: absolute; right: 4px; top: 4px; display: flex; align-items: center; gap: 2px; }
  .mtools .del { position: static; }
  .mv-wrap { position: relative; }
  .mvbtn { font-size: 11px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; align-self: flex-start; }
  .card:hover { border-color: var(--border-h); box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .mtitle { font-size: 14px; font-weight: 600; line-height: 1.4; color: var(--text); cursor: text; word-break: break-word; padding-right: 40px; }
  .pbar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .pbar .track { flex: 1; height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .pbar .fill { height: 100%; border-radius: 999px; }
  .pbar .num { font-family: var(--mono); font-size: 12px; color: var(--text2); }

  .del { position: absolute; right: 6px; top: 6px; border: 0; background: none; font-size: 12px; color: var(--muted); cursor: pointer; opacity: 0; transition: opacity .15s; }
  .del:hover { color: #ef4444; }
  .group:hover .del, .target:hover .del, .task:hover .del { opacity: 1; }
  .target .del, .task .del { position: static; font-size: 10px; flex-shrink: 0; }

  .target { display: flex; align-items: flex-start; gap: 6px; border-radius: 4px; padding: 2px 4px; }
  .target + .target { margin-top: 6px; }
  .target input[type=checkbox] { width: 14px; height: 14px; margin-top: 3px; accent-color: var(--done-cb); flex-shrink: 0; }
  .target input[type=checkbox]:disabled { opacity: .6; }
  .tname { flex: 1; min-width: 0; font-size: 13px; line-height: 20px; color: var(--text2); cursor: text; word-break: normal; overflow-wrap: break-word; }
  .tname.done { color: var(--muted); text-decoration: line-through; }
  .tfrac { font-family: var(--mono); font-size: 11px; line-height: 20px; color: var(--muted); flex-shrink: 0; }

  .addlink { border: 0; background: none; cursor: pointer; font-size: 12px; color: var(--muted); padding: 2px 4px; font-family: var(--sans); }
  .addlink:hover { color: var(--text2); }
  .addbtn { display: block; width: 100%; height: 24px; margin-top: 6px; border: 1px dashed var(--border); border-radius: 6px; background: none; cursor: pointer; font-size: 15px; line-height: 1; color: var(--muted); font-family: var(--sans); }
  .addbtn:hover { border-style: solid; border-color: var(--border-h); background: var(--fill); color: var(--text2); }
  .dashed { width: 100%; border: 1px dashed var(--border-h); border-radius: 6px; background: none; padding: 14px 0; font-size: 12px; color: var(--muted); cursor: pointer; font-family: var(--sans); }
  .dashed:hover { background: var(--fill); color: var(--text2); }

  .task { position: relative; display: flex; align-items: flex-start; gap: 4px; border-radius: 4px; padding: 2px 4px; }
  .task + .task { margin-top: 6px; }
  .task input[type=checkbox] { width: 14px; height: 14px; margin-top: 1px; accent-color: var(--done-cb); flex-shrink: 0; }
  .task .tmain { flex: 1; min-width: 0; }
  .task .txt { display: block; font-size: 13px; line-height: 17px; color: var(--text2); cursor: text; word-break: normal; overflow-wrap: break-word; }
  .task .txt.done { color: var(--muted); text-decoration: line-through; }
  .task .tlink { display: -webkit-inline-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font-family: var(--mono); font-size: 11px; line-height: 15px; padding: 0 5px; border-radius: 4px; background: var(--linkchip-bg); color: var(--linkchip-c); max-width: 100%; overflow-wrap: break-word; }
  .task.hl { outline: 1px solid var(--hl-ring); background: var(--hl-bg); }
  .task .tools { position: absolute; top: 0; right: 0; display: flex; align-items: center; gap: 2px; padding: 0 2px; background: var(--card); border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.12); opacity: 0; transition: opacity .15s; }
  .task:hover .tools { opacity: 1; }

  .chip-wrap { position: relative; }
  .chip { border: 0; cursor: pointer; border-radius: 999px; padding: 0 6px; font-size: 10px; line-height: 16px; background: none; color: var(--muted); }
  .chip:hover { background: var(--fill); }
  .chip.linked { background: var(--linkchip-bg); color: var(--linkchip-c); }
  .dropdown { position: absolute; right: 0; top: 18px; z-index: 40; width: 176px; padding: 4px 0; background: var(--pop); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--pop-shadow); }
  .dropdown button { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 4px 12px; font-size: 12px; color: var(--text2); cursor: pointer; overflow-wrap: break-word; font-family: var(--sans); }
  .dropdown button:hover { background: var(--fill); }
  .dropdown button.sel { font-weight: 600; color: var(--text); }

  .inline { width: 100%; padding: 3px 6px; font-size: 14px; font-family: var(--sans); color: var(--text); background: var(--card); border: 1px solid var(--border-h); border-radius: 4px; outline: none; }
  .gcell .inline, .task .inline, .target .inline { font-size: 12px; }

  /* ---------- goals week grid ---------- */
  .cobanner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 14px; background: var(--card); border: 1px solid var(--border); border-left: 3px solid #d97706; border-radius: 8px; }
  .cobanner .coic { color: #d97706; display: inline-flex; flex-shrink: 0; }
  .cobanner .cot { flex: 1; min-width: 0; }
  .cobanner .cot b { display: block; font-size: 13px; color: var(--text); }
  .cobanner .cot span { font-size: 12px; color: var(--muted); }
  .copanel { margin: -8px 0 14px; padding: 6px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
  .corow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 7px 0; font-size: 13px; }
  .corow + .corow { border-top: 1px solid var(--border); }
  .corow .ct { flex: 1; min-width: 0; color: var(--text2); overflow-wrap: break-word; }
  .corow .ct small { display: block; font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .cobadge { flex-shrink: 0; font-size: 10px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: rgba(217,119,6,.14); color: #d97706; }
  .mvdays { display: flex; gap: 2px; flex-shrink: 0; }
  .mvdays button { border: 1px solid var(--border); background: none; border-radius: 4px; padding: 1px 6px; font-family: var(--mono); font-size: 10px; color: var(--text2); cursor: pointer; }
  .mvdays button:hover { border-color: var(--border-h); background: var(--fill); color: var(--text); }

  .gboard { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .ghead, .grow { display: grid; grid-template-columns: 224px repeat(7, minmax(0, 1fr)); }
  .ghead { border-bottom: 1px solid var(--border); }
  .ghead .gh { border: 0; background: none; border-left: 1px solid var(--border); padding: 7px 4px 6px; text-align: center; font-family: var(--mono); font-size: 10px; letter-spacing: .05em; color: var(--muted); cursor: pointer; }
  .ghead .gh:first-child { border-left: 0; cursor: default; }
  .ghead .gh b { display: block; font-size: 13px; font-weight: 600; color: var(--text2); }
  .ghead .gh.today { color: var(--today-head); }
  .ghead .gh.today b { color: var(--today-head); }
  .ghead .gh.sel { background: var(--fill); }
  .ghead .gh .gtdot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--today-head); }
  .grow + .grow { border-top: 1px solid var(--border); }
  .gboard .cathead { margin: 0; padding: 6px 12px; border-bottom: 1px solid var(--border); }
  .glabel { position: relative; padding: 10px 12px; }
  .glabel .gt { display: flex; align-items: flex-start; gap: 7px; font-size: 13px; font-weight: 600; color: var(--text); }
  .glabel .gt .catdot { margin-top: 3px; }
  .glabel .gtname { cursor: text; min-width: 0; overflow-wrap: break-word; padding-right: 34px; }
  .glabel .gsub { font-size: 11px; color: var(--muted); margin: 1px 0 6px 17px; }
  .gcell { min-height: 64px; padding: 4px; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
  .gcell.today { background: var(--today-bg); }
  .gcell.future { opacity: .6; }
  .gcell .tasks { flex: 1; }
  .addghost { border: 0; background: none; width: 100%; padding: 4px; font-size: 11px; color: var(--muted); cursor: pointer; border-radius: 4px; font-family: var(--sans); text-align: left; }
  .addghost:hover { background: var(--fill); color: var(--text2); }
  .tpop { position: absolute; left: 8px; top: calc(100% - 2px); z-index: 42; width: 240px; padding: 8px; background: var(--pop); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--pop-shadow); }
  .tpop .tpop-h { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px 2px; }
  .gcell .task .txt { font-size: 12px; }

  .tpanel { margin-top: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .tp-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .tp-head .tp-title { font-size: 13px; font-weight: 700; color: var(--text); }
  .tp-head .tp-prog { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--text2); white-space: nowrap; }
  .tp-head .pbar { width: 160px; margin: 0; flex-shrink: 0; }
  .tp-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .tp-h { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .tp-empty { font-size: 12px; color: var(--muted); padding: 6px 0; }
  .tp-goal { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .tp-add { margin-top: 8px; }
  .goalpick { position: absolute; right: 0; bottom: calc(100% + 4px); z-index: 42; width: 224px; padding: 4px 0; background: var(--pop); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--pop-shadow); }
  .goalpick button { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 5px 12px; font-size: 12px; color: var(--text2); cursor: pointer; font-family: var(--sans); }
  .goalpick button:hover { background: var(--fill); }
  .goalpick .catdot { display: inline-block; margin-right: 6px; }

  .wsum { margin-top: 12px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 10px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; color: var(--text2); }
  .wsum .wst { font-weight: 700; color: var(--text); }
  .wsum .ws-item { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); }
  .wsum .ws-item .catdot { display: inline-block; }
  .wsum .ws-all { margin-left: auto; font-weight: 700; }
  .wsum .ws-all b { color: #22c55e; }

  /* Month calendar view */
  .period-toggle{display:inline-flex;border:1px solid var(--border);border-radius:7px;padding:2px;gap:2px}
  .period-toggle button{border:0;border-radius:5px;padding:5px 10px;background:transparent;color:var(--text2);font:600 11px var(--sans);cursor:pointer}
  .period-toggle button.sel{background:var(--fill);color:var(--text)}
  .month-board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--card)}
  .month-dow{padding:8px;text-align:center;font:10px var(--mono);color:var(--muted);border-bottom:1px solid var(--border)}
  .month-day{min-width:0;min-height:124px;padding:7px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--card)}
  .month-day.out{opacity:.42}.month-day.today{background:var(--today-bg)}.month-day.selected{box-shadow:inset 0 0 0 2px var(--today-head)}
  .month-date{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
  .month-date button{border:0;background:none;padding:2px 4px;color:var(--text2);font:600 12px var(--mono);cursor:pointer}
  .month-task{display:flex;gap:4px;align-items:flex-start;margin:3px 0;font-size:10px;line-height:1.3;color:var(--text2)}
  .month-task input{width:12px;height:12px;margin:0;flex-shrink:0;accent-color:var(--done-cb)}
  .month-task span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.month-task.done span{text-decoration:line-through;opacity:.55}
  .month-more{font:10px var(--mono);color:var(--muted);padding-left:16px}.month-summary{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.month-cat{display:flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--card);font-size:11px;color:var(--text2)}.month-cat b{color:var(--text);margin-left:6px}.month-cat small{color:var(--muted);font:10px var(--mono)}
  .hsummary{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 14px}.hstat{flex:1;min-width:130px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card)}
  .hstat b{display:block;font-size:20px;color:var(--text)}.hstat span{color:var(--muted);font-size:11px}
  @media(max-width:767px){.period-toggle{display:none}.month-day{min-height:72px;padding:3px}.month-task{font-size:9px}.month-task input{width:10px;height:10px}.month-more{font-size:9px;padding-left:0}}

  /* ---------- view toggle ---------- */
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
  .seg button { border: 0; background: none; padding: 0 10px; height: 26px; font-size: 12px; color: var(--text2); cursor: pointer; font-family: var(--sans); }
  .seg button + button { border-left: 1px solid var(--border); }

<div class="wrap">
  <div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';

/* ---------------- dates (local time only, no toISOString) ---------------- */
const pad = (n) => String(n).padStart(2, '0');
const toISODate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const monthKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };

function weekStartOf(d) {
  const r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  r.setDate(r.getDate() - ((r.getDay() + 6) % 7));
  return toISODate(r);
}
/** Full Mon–Sun week. */
function weekDays(weekStart) {
  const mon = parseISO(weekStart);
  return Array.from({ length: 7 }, (_, i) => toISODate(addDays(mon, i)));
}
const weekDays7 = weekDays;
/** A week belongs to the month containing its Thursday (ISO convention). */
function monthOfWeek(weekStart) {
  return monthKey(addDays(parseISO(weekStart), 3));
}
/** All Mondays whose Thursday falls in `month`. */
function weeksOfMonth(month) {
  const [y, m] = month.split('-').map(Number);
  let w = parseISO(weekStartOf(new Date(y, m - 1, 1)));
  if (monthOfWeek(toISODate(w)) !== month) w = addDays(w, 7);
  const out = [];
  while (monthOfWeek(toISODate(w)) === month) { out.push(toISODate(w)); w = addDays(w, 7); }
  return out;
}
function isoWeekNumber(weekStart) {
  const thu = addDays(parseISO(weekStart), 3);
  const jan1 = new Date(thu.getFullYear(), 0, 1);
  return Math.floor((thu - jan1) / (7 * 864e5)) + 1;
}
function shiftMonth(month, delta) {
  const [y, m] = month.split('-').map(Number);
  return monthKey(new Date(y, m - 1 + delta, 1));
}
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const formatMonth = (month) => `${MONTHS[Number(month.slice(5)) - 1]} ${month.slice(0, 4)}`;
/** e.g. "Oct 19 – 24" or "Sep 28 – Oct 3" */
function formatWeekRangeShort(ws) {
  const mon = parseISO(ws), sat = addDays(mon, 5);
  const a = `${MON[mon.getMonth()]} ${mon.getDate()}`;
  const b = sat.getMonth() === mon.getMonth() ? `${sat.getDate()}` : `${MON[sat.getMonth()]} ${sat.getDate()}`;
  return `${a} – ${b}`;
}
const dayLabel = (iso) => `${WD[parseISO(iso).getDay()].toUpperCase()} ${parseISO(iso).getDate()}`;

/* ---------------- progress (port of src/lib/progress.ts) ---------------- */
function targetStatus(target, tasks) {
  const linked = tasks.filter((t) => t.targetId === target.id);
  if (linked.length > 0) {
    const doneCount = linked.filter((t) => t.done).length;
    return { done: doneCount === linked.length, doneCount, total: linked.length };
  }
  return { done: target.manualDone, doneCount: target.manualDone ? 1 : 0, total: 0 };
}
function weekProgress(targets, tasks) {
  if (targets.length > 0) return targets.filter((t) => targetStatus(t, tasks).done).length / targets.length;
  if (tasks.length > 0) return tasks.filter((t) => t.done).length / tasks.length;
  return 0;
}
function monthProgress(weekProgressList) {
  if (weekProgressList.length === 0) return 0;
  return weekProgressList.reduce((a, b) => a + b, 0) / weekProgressList.length;
}

/* ---------------- storage ---------------- */
const KEY = 'goal-tracker-v1';
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36));

let state = null;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) { /* corrupted */ }
  return null;
}

function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

/* ---------------- optional Supabase cloud sync ---------------- */
const SUPABASE_URL = 'https://xpdsqupbkubpkmkaidvx.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_IrxKdK9KXASoWSJnMFs4cg_sJO83ueH';
const supabaseClient = window.supabase?.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: false,
    flowType: 'pkce',
  },
});

// Process the PKCE callback before any cloud-sync action checks the session.
// Keeping this as a shared promise prevents a sync click from racing the exchange.
const authReady = (async () => {
  if (!supabaseClient) return null;

  const callbackUrl = new URL(window.location.href);
  const code = callbackUrl.searchParams.get('code');
  const authError = callbackUrl.searchParams.get('error_description') ||
    callbackUrl.searchParams.get('error');

  if (authError) {
    callbackUrl.searchParams.delete('error_description');
    callbackUrl.searchParams.delete('error');
    callbackUrl.searchParams.delete('error_code');
    window.history.replaceState({}, document.title,
      callbackUrl.pathname + callbackUrl.search + callbackUrl.hash);
    throw new Error(authError);
  }

  if (code) {
    const { data, error } = await supabaseClient.auth.exchangeCodeForSession(code);
    callbackUrl.searchParams.delete('code');
    window.history.replaceState({}, document.title,
      callbackUrl.pathname + callbackUrl.search + callbackUrl.hash);
    if (error) throw error;
    return data.session;
  }

  const { data, error } = await supabaseClient.auth.getSession();
  if (error) throw error;
  return data.session;
})();

function hasTrackerData(data) {
  return ['monthGoals', 'weekPlans', 'weekTargets', 'dayTasks', 'habits', 'exploreItems', 'bucketItems', 'bucketCategories']
    .some((key) => Array.isArray(data[key]) && data[key].length > 0);
}

function showCloudSyncOptions(cloud, user) {
  return new Promise((resolve, reject) => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px;';
    const panel = document.createElement('div');
    panel.style.cssText = 'width:min(100%,420px);padding:24px;border-radius:18px;background:var(--card, #111827);color:var(--text, #e5e7eb);box-shadow:0 12px 40px rgba(0,0,0,.25);';
    panel.innerHTML = `
      <h2 style="margin:0 0 8px;font-size:1.25rem;color:var(--text)">Cloud sync</h2>
      <p style="margin:0 0 6px;color:var(--text2)">Choose what you want to do.</p>
      <p style="margin:0 0 20px;font-size:.85rem;color:var(--text2)">Cloud backup · Version ${Number(cloud.version)} · Updated ${new Date(cloud.updated_at).toLocaleString()}</p>
      <button type="button" data-cloud-choice="upload" style="width:100%;padding:14px;margin-bottom:10px;border:0;border-radius:10px;background:#2563eb;color:#ffffff;font:inherit;font-weight:700">↑ Upload to cloud</button>
      <button type="button" data-cloud-choice="download" style="width:100%;padding:14px;margin-bottom:10px;border:1px solid var(--border-h);border-radius:10px;background:var(--fill);color:var(--text);font:inherit;font-weight:700">↓ Download from cloud</button>
      <button type="button" data-cloud-choice="cancel" style="width:100%;padding:10px;border:0;background:transparent;color:var(--text2);font:inherit;font-weight:600">Cancel</button>
    `;
    overlay.appendChild(panel);
    document.body.appendChild(overlay);

    const close = () => { overlay.remove(); resolve(); };
    panel.querySelector('[data-cloud-choice="cancel"]').addEventListener('click', close);
    overlay.addEventListener('click', event => { if (event.target === overlay) close(); });

    panel.querySelector('[data-cloud-choice="download"]').addEventListener('click', async () => {
      const proceed = await showAppDialog({ title: 'Replace local data?', description: 'This will replace the data currently open in this browser with the cloud copy. Export a backup first if you need to keep the local version.', fields: [], submitLabel: 'Replace with cloud copy' });
      if (!proceed) return;
      try {
        if (!cloud.data || typeof cloud.data !== 'object' || Array.isArray(cloud.data)) {
          throw new Error('The cloud backup has an unexpected format. Local data was not changed.');
        }
        state = {
          monthGoals: [], weekPlans: [], weekTargets: [], dayTasks: [], habits: [], exploreItems: [], bucketItems: [], bucketCategories: [], view: 'goals',
          ...cloud.data,
        };
        if (!Array.isArray(state.habits)) state.habits = [];
        if (!Array.isArray(state.exploreItems)) state.exploreItems = [];
        if (!Array.isArray(state.bucketItems)) state.bucketItems = [];
        if (!Array.isArray(state.bucketCategories)) state.bucketCategories = [];
        if (!['habits','explore','bucket'].includes(state.view)) state.view = 'goals';
        ensureCategories();
        save();
        render();
        close();
        await showAppNotice('Download complete', 'The cloud data is now loaded in this browser.');
      } catch (err) {
        overlay.remove();
        reject(err);
      }
    });

    panel.querySelector('[data-cloud-choice="upload"]').addEventListener('click', async () => {
      if (!hasTrackerData(state)) {
        await showAppNotice('Nothing to upload yet', 'This browser has no goals, plans, tasks, habits or saved Explore items to upload.');
        return;
      }
      const proceed = await showAppDialog({ title: 'Replace cloud backup?', description: 'This will replace the existing cloud backup with the data currently open in this browser. Export a JSON backup first if you need a separate copy.', fields: [], submitLabel: 'Upload and replace backup' });
      if (!proceed) return;
      try {
        const { data: updated, error } = await supabaseClient
          .from('goal_tracker_data')
          .update({
            data: state,
            version: cloud.version + 1,
            updated_at: new Date().toISOString(),
          })
          .eq('user_id', user.id)
          .eq('version', cloud.version)
          .select('version')
          .maybeSingle();
        if (error) throw error;
        if (!updated) {
          await showAppNotice('Cloud backup changed', 'Nothing was overwritten. Open Cloud Sync again to review the latest version.');
          return;
        }
        close();
        await showAppNotice('Cloud backup updated', 'Your cloud backup is now version ' + updated.version + '.');
      } catch (err) {
        overlay.remove();
        reject(err);
      }
    });
  });
}

async function cloudSync() {
  if (!supabaseClient) {
    await showAppNotice('Cloud sync unavailable', 'The cloud sync service could not load. Check your internet connection and reload the app.');
    return;
  }

  try {
    // Wait for any magic-link callback exchange before checking the session.
    await authReady;
    const { data: sessionData, error } = await supabaseClient.auth.getSession();
    if (error) throw error;

    if (!sessionData.session) {
      const credentials = await showAppDialog({ title: 'Sign in to cloud sync', description: 'Enter your email. We’ll send a secure sign-in link to this address.', submitLabel: 'Send sign-in link', fields: [{ name: 'email', label: 'Email address', type: 'email', required: true, placeholder: 'you@example.com' }] });
      if (!credentials) return;
      const { error: signInError } = await supabaseClient.auth.signInWithOtp({
        email: credentials.email,
        options: { emailRedirectTo: new URL('./', window.location.href).toString() },
      });
      if (signInError) throw signInError;
      await showAppNotice('Check your email', 'A sign-in link has been sent. Open it in this same browser, then choose Cloud Sync again.');
      return;
    }

    const user = sessionData.session.user;
    const { data: cloud, error: readError } = await supabaseClient
      .from('goal_tracker_data')
      .select('data, version, updated_at')
      .eq('user_id', user.id)
      .maybeSingle();
    if (readError) throw readError;

    if (!cloud) {
      if (!hasTrackerData(state)) {
        await showAppNotice('Nothing to upload yet', 'This device has no goals, plans, tasks or habits. Import your JSON backup first, then choose Cloud Sync again.');
        return;
      }
      const proceed = await showAppDialog({ title: 'Create your cloud backup?', description: 'No cloud backup exists for this account. Upload the data currently open in this browser? Your JSON export will not be changed.', fields: [], submitLabel: 'Upload first backup' });
      if (!proceed) return;
      const { error: insertError } = await supabaseClient
        .from('goal_tracker_data')
        .insert({ user_id: user.id, data: state, version: 1 });
      if (insertError) throw insertError;
      await showAppNotice('Backup complete', 'Your tracker data is now backed up in Supabase.');
      return;
    }

    await showCloudSyncOptions(cloud, user);
    return;
  } catch (err) {
    console.error('Cloud sync failed:', err);
    await showAppNotice('Cloud sync failed', err.message || String(err));
  }
}

function showAppDialog({ title, description = '', fields = [], submitLabel = 'Save', initial = {} }) {
  return new Promise((resolve) => {
    const overlay = document.createElement('div'); overlay.className = 'app-dialog-backdrop';
    const panel = document.createElement('form'); panel.className = 'app-dialog';
    panel.innerHTML = `<div class="app-dialog-head"><h2>${esc(title)}</h2><p>${esc(description)}</p></div><div class="app-dialog-fields"></div><div class="app-dialog-actions"><button type="button" class="dialog-cancel">Cancel</button><button type="submit" class="dialog-submit">${esc(submitLabel)}</button></div>`;
    const root = panel.querySelector('.app-dialog-fields');
    for (const field of fields) {
      const wrap=document.createElement('label');wrap.className='dialog-field';
      const caption=document.createElement('span');caption.textContent=field.label;wrap.appendChild(caption);
      let input;
      if(field.type==='textarea'){input=document.createElement('textarea');input.rows=field.rows||3;}
      else if(field.type==='select'){input=document.createElement('select');for(const option of field.options||[]){const opt=document.createElement('option');opt.value=option.value;opt.textContent=option.label;input.appendChild(opt);}}
      else{input=document.createElement('input');input.type=field.type||'text';}
      input.name=field.name;input.value=initial[field.name]??field.value??'';if(field.placeholder)input.placeholder=field.placeholder;if(field.required)input.required=true;
      wrap.appendChild(input);root.appendChild(wrap);
    }
    overlay.appendChild(panel);document.body.appendChild(overlay);
    const finish=value=>{overlay.remove();resolve(value);};
    panel.querySelector('.dialog-cancel').addEventListener('click',()=>finish(null));
    overlay.addEventListener('click',e=>{if(e.target===overlay)finish(null);});
    panel.addEventListener('submit',e=>{e.preventDefault();const values={};for(const field of fields)values[field.name]=panel.elements.namedItem(field.name).value.trim();if(fields.some(field=>field.required&&!values[field.name]))return;finish(values);});
    panel.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();finish(null);}});
    panel.querySelector('input,textarea,select')?.focus();
  });
}

function renderCal() {
  const weeks = weeksOfMonth(calViewMonth);
  const today = toISODate(new Date());
  const catOrd = new Map(state.categories.map((c) => [c.id, c.order]));
  const goals = visibleGoals(calViewMonth)
    .sort((a, b) => (catOrd.get(a.categoryId) ?? 99) - (catOrd.get(b.categoryId) ?? 99) || a.order - b.order);
  // per-date task counts + done-by-goal breakdown, single pass over dayTasks
  const goalTitleByPlan = new Map();
  for (const p of state.weekPlans) {
    const g = state.monthGoals.find((x) => x.id === p.monthGoalId);
    if (g) goalTitleByPlan.set(p.id, g.title);
  }
  const counts = new Map(); // date -> {total, done, byGoal: Map<title, doneCount>}
  for (const t of state.dayTasks) {
    let e = counts.get(t.date);
    if (!e) { e = { total: 0, done: 0, byGoal: new Map() }; counts.set(t.date, e); }
    e.total++;
    if (t.done) {
      e.done++;
      const title = goalTitleByPlan.get(t.weekPlanId) || '';
      e.byGoal.set(title, (e.byGoal.get(title) || 0) + 1);
    }
  }
  const cellHtml = (d) => {
    const e = counts.get(d) || { total: 0, done: 0, byGoal: new Map() };
    const lvl = e.done === 0 ? 0 : e.done === 1 ? 1 : e.done === 2 ? 2 : e.done <= 4 ? 3 : 4;
    const dd = parseISO(d);
    let tip = `${WD[dd.getDay()]} ${dd.getDate()} ${MON[dd.getMonth()]} · `;
    tip += e.total === 0 ? 'no tasks' : `${e.done} of ${e.total} done`;
    if (e.done > 0) tip += ' — ' + [...e.byGoal].map(([t2, n]) => `${t2}: ${n}`).join(', ');
    return `<span class="cd h${lvl} ${d.slice(0, 7) !== calViewMonth ? 'out' : ''} ${d === today ? 'today' : ''}" title="${esc(tip)}">${dd.getDate()}</span>`;
  };
  const rows = weeks.map((ws) => {
    const days = weekDays(ws);
    const dots = goals.map((g) => {
      const plan = state.weekPlans.find((p) => p.monthGoalId === g.id && p.weekStart === ws);
      let frac = 0;
      if (plan) {
        frac = weekProgress(
          state.weekTargets.filter((t) => t.weekPlanId === plan.id),
          state.dayTasks.filter((t) => t.weekPlanId === plan.id),
        );
      }
      const col = catColorOf(g);
      const style = frac > 0 ? ` style="background:${col};border-color:${col}"` : '';
      return `<span class="dot"${style} title="${esc(g.title)} — ${Math.round(frac * 100)}%"></span>`;
    }).join('');
    return `<div class="calrow ${ws === curWeek ? 'sel' : ''}" data-action="cal-week" data-week="${ws}">
      <span class="wk">W${isoWeekNumber(ws)}</span>
      ${days.map(cellHtml).join('')}
      <span class="dots">${dots}</span>
    </div>`;
  }).join('');
  return `<div class="calpop">
    <div class="calhead">
      <button class="gbtn" data-action="cal-prev" aria-label="Previous month">◀</button>
      <span class="cm">${formatMonth(calViewMonth)}</span>
      <button class="gbtn" data-action="cal-next" aria-label="Next month">▶</button>
    </div>
    <div class="calgrid">
      <span class="ch"></span>${['M', 'T', 'W', 'T', 'F', 'S'].map((d) => `<span class="ch">${d}</span>`).join('')}<span class="ch"></span>
      ${rows}
    </div>
    <div class="callegend">Less <span class="sw h0"></span><span class="sw h1"></span><span class="sw h2"></span><span class="sw h3"></span><span class="sw h4"></span> More</div>
  </div>`;
}

function taskHtml(t, targets) {
  const linked = targets.find((x) => x.id === t.targetId);
  const chip = `<div class="chip-wrap">
    <button class="chip ${linked ? 'linked' : ''}" data-action="chip" data-id="${t.id}" title="${linked ? 'Linked to: ' + esc(linked.title) : 'Link to a weekly target'}">⚑</button>
    ${chipOpenFor === t.id ? `<div class="dropdown">
      <button data-action="chip-pick" data-task="${t.id}" data-target="">none</button>
      ${targets.map((x) => `<button data-action="chip-pick" data-task="${t.id}" data-target="${x.id}" class="${x.id === t.targetId ? 'sel' : ''}">${esc(x.title)}</button>`).join('')}
    </div>` : ''}
  </div>`;
  return `<div class="task" data-tid="${t.targetId || ''}">
    <input type="checkbox" data-change="task-done" data-id="${t.id}" ${t.done ? 'checked' : ''} />
    <span class="tmain">
      <span class="txt ${t.done ? 'done' : ''}" data-action="edit-task" data-id="${t.id}">${esc(t.text)}</span>
      ${linked ? `<div class="tlink" title="${esc(linked.title)}">⚑ ${esc(linked.title)}</div>` : ''}
      ${t.originalDate && t.originalDate !== t.date ? `<div class="tlink">Moved from ${dayLabel(t.originalDate)}</div>` : ''}
    </span>
    <span class="tools">${chip}<button class="del" data-action="del-task" data-id="${t.id}" title="Delete task">✕</button></span>
  </div>`;
}

/* ---------------- phone layout ---------------- */
function renderPhone() {
  const curMonth = monthOfWeek(curWeek);
  const days = weekDays(curWeek);
  const today = toISODate(new Date());
  const isCurWeek = curWeek === weekStartOf(new Date());
  const isToday = isCurWeek && curDay === today;
  const wn = isoWeekNumber(curWeek);
  const goals = visibleGoals(curMonth);
  const goalIds = new Set(goals.map((g) => g.id));
  const planIds = new Set(state.weekPlans.filter((p) => goalIds.has(p.monthGoalId) && p.weekStart === curWeek).map((p) => p.id));
  const busyDays = new Set(state.dayTasks.filter((t) => planIds.has(t.weekPlanId)).map((t) => t.date));

  const chips = days.map((d) => `<button class="dchip ${d === curDay ? 'sel' : ''} ${d === today ? 'today' : ''}" data-action="set-day" data-date="${d}">
      <span class="dn">${WD[parseISO(d).getDay()].toUpperCase()}</span>
      <span class="dd">${parseISO(d).getDate()}</span>
      ${busyDays.has(d) ? '<span class="ddot"></span>' : ''}
    </button>`).join('');

  const cards = catSections(curMonth)
    .map((s) => catHeadHtml(s.cat, s.goals) + (s.cat && s.cat.collapsed ? '' : s.goals.map((g) => renderPhoneCard(g, curDay, today)).join('')))
    .join('');

  const co = carryOvers();
  const coCard = co.length
    ? `<details class="pcard cocard" open><summary>Carry-over · ${co.length}</summary><div class="psec co-rows">${co.map((x) => coRowHtml(x, true)).join('')}</div></details>`
    : '';

  app.innerHTML = `
    <header>
      <span class="logo">${LOGO}</span>
      ${segHtml()}
      <div class="switcher">
        <button class="gbtn" data-action="prev-week" aria-label="Previous week">◀</button>
        <span class="wlabel">W${wn} · ${esc(formatWeekRangeShort(curWeek))}</span>
        <button class="gbtn" data-action="next-week" aria-label="Next week">▶</button>
      </div>
      ${isToday ? '' : '<button class="gbtn" data-action="today">Today</button>'}
      <div class="menu-wrap">
        <button class="gbtn" data-action="menu" aria-label="Menu">⋯</button>
        ${menuOpen ? `<div class="menu">
          <button data-action="cal">Month calendar…</button>
          <button data-action="export">Export backup (JSON)</button>
          <button data-action="import">Import backup (JSON)</button>
          ${installEvt ? '<button data-action="install">Install app</button>' : ''}
        </div>` : ''}
      </div>
      ${state.view === 'goals' ? `<div class="daybar">
        <button class="gbtn dnav" data-action="prev-day" aria-label="Previous day">‹</button>
        ${chips}
        <button class="gbtn dnav" data-action="next-day" aria-label="Next day">›</button>
      </div>` : ''}
      ${calOpen ? `<div class="cal-wrap"><div class="backdrop" data-action="cal-close"></div>${renderCal()}</div>` : ''}
    </header>
    ${state.view === 'habits' ? renderPhoneHabits(today) : state.view === 'explore' ? renderExploreMain() : state.view === 'bucket' ? renderBucketMain() : `<main>
      ${coCard}
      ${cards}

    return `<div class="pcard group" data-hid="${h.id}">

function renderPhoneCard(goal, day, today) {
  const plans = state.weekPlans.filter((p) => p.monthGoalId === goal.id);
  const plan = plans.find((p) => p.weekStart === curWeek);
  const targets = plan ? state.weekTargets.filter((t) => t.weekPlanId === plan.id).sort((a, b) => a.order - b.order) : [];
  const tasks = plan ? state.dayTasks.filter((t) => t.weekPlanId === plan.id) : [];
  const dayTasks = tasks.filter((t) => t.date === day).sort((a, b) => a.order - b.order);
  const wFrac = plan ? weekProgress(targets, tasks) : 0;

  const weekPart = plan
    ? `
       ${bar(wFrac, 'w')}
       ${targets.map((t) => {
         const s = targetStatus(t, tasks);
         const derived = s.total > 0;
         return `<div class="target" data-tid="${t.id}">
           <input type="checkbox" data-change="target-done" data-id="${t.id}" ${s.done ? 'checked' : ''} ${derived ? 'disabled' : ''} />
           <span class="tname ${s.done ? 'done' : ''}" data-action="edit-target" data-id="${t.id}">${esc(t.title)}</span>
           ${derived ? `<span class="tfrac">${s.doneCount}/${s.total}</span>` : ''}
           <button class="del" data-action="del-target" data-id="${t.id}" title="Delete target">✕</button>
         </div>`;
       }).join('')}
       <button class="addbtn" data-action="add-target" data-plan="${plan.id}" data-goal="${goal.id}">＋ Add target</button>`
    : `<button class="dashed" data-action="add-plan" data-goal="${goal.id}">＋ Plan this week</button>`;

  return `<div class="pcard group" data-goal="${goal.id}">
    <div class="psec">

      <div class="mtitle" data-action="edit-goal" data-id="${goal.id}">${esc(goal.title)}</div>
      ${plan ? bar(wFrac, 'w') : ''}
      <div class="mtools">
        <div class="mv-wrap"><button class="del mvbtn" data-action="move-goal" data-id="${goal.id}" title="Goal options">⋯</button>
          ${moveFor === goal.id ? `<div class="dropdown">
            <div class="dd-h">Goal options</div>
            <button data-action="goal-close" data-id="${goal.id}">✓ Mark complete</button>
            <div class="dd-sep"></div>
            <div class="dd-h">Move to category</div>
            ${state.categories.slice().sort((a, b) => a.order - b.order).map((c) =>
              `<button data-action="move-pick" data-id="${goal.id}" data-cat="${c.id}" class="${c.id === goal.categoryId ? 'sel' : ''}"><span class="catdot" style="background:${c.color}"></span>${esc(c.name)}</button>`).join('')}
            <button data-action="move-pick" data-id="${goal.id}" data-cat="" class="${!catOf(goal) ? 'sel' : ''}">Uncategorized</button>
            <div class="dd-sep"></div>
            <button class="danger" data-action="del-goal" data-id="${goal.id}">✕ Delete goal</button>
          </div>` : ''}
        </div>
      </div>
    </div>
    <div class="psec">${weekPart}</div>
    <div class="psec">
      <div class="pday ${day === today ? 'today' : ''}">${WD[parseISO(day).getDay()].toUpperCase()} ${parseISO(day).getDate()}</div>
      ${dayTasks.map((t) => taskHtml(t, targets)).join('')}
      <button class="addbtn" data-action="add-task" data-goal="${goal.id}" data-plan="${plan ? plan.id : ''}" data-date="${day}">＋ Add task</button>
    </div>
  </div>`;
}

/* ---------------- inline editing ---------------- */
function openInline(el, initial, onSubmit, onCancel) {
  const input = document.createElement('input');
  input.className = 'inline';
  input.value = initial;
  el.replaceWith(input);
  input.focus();
  input.select();
  inlineOpen = true;
  let done = false;
  const finish = (fn) => { inlineOpen = false; fn(); };
  const commit = () => { if (!done) { done = true; const v = input.value.trim(); if (v) finish(() => onSubmit(v)); else finish(onCancel || render); } };
  const cancel = () => { if (!done) { done = true; finish(onCancel || render); } };
  input.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') commit();
    else if (e.key === 'Escape') cancel();
  });
  input.addEventListener('blur', commit);
}

/* ---------------- events ---------------- */
app.addEventListener('click', (e) => {
  // outside-click closes menu / chip dropdown / calendar (flags only; render below once)
  let closed = false;
  if (!e.target.closest('.menu-wrap') && menuOpen) { menuOpen = false; closed = true; }
  if (!e.target.closest('.chip-wrap') && chipOpenFor) { chipOpenFor = null; closed = true; }
  if (!e.target.closest('.cal-wrap') && calOpen) { calOpen = false; closed = true; }
  if (!e.target.closest('.catdot-wrap') && paletteFor) { paletteFor = null; closed = true; }
  if (!e.target.closest('.mv-wrap') && moveFor) { moveFor = null; closed = true; }
  if (!e.target.closest('.hl-wrap') && linkFor) { linkFor = null; closed = true; }
  if (!e.target.closest('.glabel') && targetsFor) { targetsFor = null; closed = true; }
  if (!e.target.closest('.goalpick-wrap') && panelPickOpen) { panelPickOpen = false; closed = true; }
  const el = e.target.closest('[data-action]');
  if (!el) { if (closed) render(); return; }
  const a = el.dataset.action;
  const id = el.dataset.id;
  // if a close happened, `el` is stale after render(); re-query it for DOM-level ops
  const sel = `[data-action="${a}"]` + ['id', 'goal', 'plan', 'date', 'task', 'target', 'week', 'cat', 'color']
    .filter((k) => el.dataset[k])
    .map((k) => `[data-${k}="${CSS.escape(el.dataset[k])}"]`)
    .join('');
  const withEl = (fn) => {
    if (closed) { render(); fn(app.querySelector(sel)); }
    else fn(el);
  };
  const curMonth = monthOfWeek(curWeek);

  switch (a) {
    case 'set-view': state.view = ['habits','explore','bucket'].includes(el.dataset.v) ? el.dataset.v : 'goals'; save(); render(); break;
    case 'prev-week': setWeek(toISODate(addDays(parseISO(curWeek), -7))); render(); break;
    case 'next-week': setWeek(toISODate(addDays(parseISO(curWeek), 7))); render(); break;
    case 'goals-period': goalsPeriod = el.dataset.period === 'month' ? 'month' : 'week'; if (goalsPeriod === 'month') curMonthView = monthOfWeek(curWeek); render(); break;
    case 'prev-period': if (goalsPeriod === 'month' && state.view === 'goals') { curMonthView = shiftMonth(curMonthView, -1); } else setWeek(toISODate(addDays(parseISO(curWeek),-7))); render(); break;
    case 'next-period': if (goalsPeriod === 'month' && state.view === 'goals') { curMonthView = shiftMonth(curMonthView, 1); } else setWeek(toISODate(addDays(parseISO(curWeek),7))); render(); break;
    case 'month-day-select': curDay = el.dataset.date; curMonthView = curDay.slice(0,7); curWeek = weekStartOf(parseISO(curDay)); render(); break;
    case 'today': {
      curWeek = weekStartOf(new Date());
      curMonthView = monthOfWeek(curWeek);
      const wd = weekDays(curWeek), t = toISODate(new Date());
      curDay = wd.includes(t) ? t : wd[6];
      render(); break;
    }
    case 'prev-day': case 'next-day': {
      const wd = weekDays(curWeek);
      const i = wd.indexOf(curDay);
      if (a === 'next-day') {
        if (i < 6) curDay = wd[i + 1];
        else { curWeek = toISODate(addDays(parseISO(curWeek), 7)); curDay = weekDays(curWeek)[0]; }
      } else {
        if (i > 0) curDay = wd[i - 1];
        else { curWeek = toISODate(addDays(parseISO(curWeek), -7)); curDay = weekDays(curWeek)[5]; }
      }
      render(); break;
    }
    case 'set-day': case 'day-select': curDay = el.dataset.date; render(); break;
    case 'co-move': {
      const t = findTask(el.dataset.task);
      if (t) {
        const destinationDate = el.dataset.date;
        const oldPlan = findPlan(t.weekPlanId);
        const goal = oldPlan && findGoal(oldPlan.monthGoalId);
        if (goal) {
          if (!t.originalDate) t.originalDate = t.date;
          t.rescheduledFrom = t.rescheduledFrom || [];
          t.rescheduledFrom.push({ date: t.date, weekPlanId: t.weekPlanId });
          const destinationPlan = getOrCreateWeekPlan(goal.id, weekStartOf(parseISO(destinationDate)));
          t.weekPlanId = destinationPlan.id;
          t.targetId = undefined;
          t.date = destinationDate;
          t.order = state.dayTasks.filter((x) => x !== t && x.weekPlanId === t.weekPlanId && x.date === t.date).length;
          save();
        }
      }
      render(); break;
    }
    case 'targets-pop': targetsFor = targetsFor === id ? null : id; moveFor = null; render(); break;
    case 'targets-open': targetsFor = id; moveFor = null; render(); break;
    case 'panel-add': panelPickOpen = !panelPickOpen; render(); break;
    case 'panel-add-pick': {
      const gid = el.dataset.goal;
      panelPickOpen = false; render();
      const btn = app.querySelector('[data-action="panel-add"]');
      if (btn) openInline(btn, '', (v) => {
        const plan = getOrCreateWeekPlan(gid, curWeek);
        addTask(plan.id, curDay, v); save(); render();
      });
      break;
    }
    case 'cal':
      calOpen = !calOpen;
      menuOpen = false;
      if (calOpen) calViewMonth = curMonth;
      render(); break;
    case 'cal-close': calOpen = false; render(); break;
    case 'cat-pal': paletteFor = paletteFor === id ? null : id; render(); break;
    case 'cat-color': {
      const c = findCat(id);
      if (c) { c.color = el.dataset.color; save(); }
      paletteFor = null; render(); break;
    }
    case 'cat-rename':
      withEl((el2) => el2 && openInline(el2, findCat(id).name, (v) => { findCat(id).name = v; save(); render(); }));
      break;
    case 'cat-del':
      if (confirm('Delete category? Its goals move to Uncategorized.')) {
        deleteCategory(id); save(); render();
      }
      break;
    case 'cat-collapse': {
      const c = findCat(id);
      if (c) { c.collapsed = !c.collapsed; save(); render(); }
      break;
    }
    case 'cat-add-goal':
      withEl((el2) => el2 && openInline(el2, '', (v) => { addGoal(v, el.dataset.id || undefined); save(); render(); }));
      break;
    case 'add-cat': {
      const cid = addCategory('New category');
      menuOpen = false; save(); render();
      const nameEl = app.querySelector(`[data-action="cat-rename"][data-id="${cid}"]`);
      if (nameEl) {
        nameEl.scrollIntoView({ block: 'center' });
        openInline(nameEl, 'New category',
          (v) => { findCat(cid).name = v; save(); render(); },
          () => { deleteCategory(cid); save(); render(); });
      }
      break;
    }
    case 'move-goal': moveFor = moveFor === id ? null : id; render(); break;
    case 'move-pick': {
      const g = findGoal(id);
      if (g) { moveGoalToCategory(g, el.dataset.cat || undefined); save(); }
      moveFor = null; render(); break;
    }
    case 'cal-prev': calViewMonth = shiftMonth(calViewMonth, -1); render(); break;
    case 'cal-next': calViewMonth = shiftMonth(calViewMonth, 1); render(); break;
    case 'cal-week': setWeek(el.dataset.week); calOpen = false; render(); break;
    case 'menu': menuOpen = !menuOpen; render(); break;
    case 'cloud-sync': menuOpen = false; render(); cloudSync(); break;
    case 'export': doExport(); menuOpen = false; render(); break;
    case 'import': document.getElementById('importFile').click(); break;
    case 'install':
      if (installEvt) { installEvt.prompt(); installEvt = null; }
      menuOpen = false; render(); break;
    case 'edit-goal':
      withEl((el2) => el2 && openInline(el2, findGoal(id).title, (v) => { findGoal(id).title = v; save(); render(); }));
      break;
    case 'goal-close': {
      const g = findGoal(id);
      if (g && confirm(`Mark "${g.title}" as completed? It will be hidden from upcoming weeks.`)) {
        g.closed = true; moveFor = null; save(); render();
      }
      break;
    }
    case 'del-goal': {
      const g = findGoal(id);
      if (confirm(`Delete "${g.title}" and all its plans, targets and tasks?`)) {
        deleteMonthGoal(id); save(); render();
      }
      break;
    }
    case 'add-plan': getOrCreateWeekPlan(el.dataset.goal, curWeek); save(); render(); break;
    case 'add-target':
      withEl((el2) => el2 && openInline(el2, '', (v) => {
        const plan = getOrCreateWeekPlan(el.dataset.goal, curWeek);
        addTarget(plan.id, v); save(); render();
      }));
      break;
    case 'edit-target':
      withEl((el2) => el2 && openInline(el2, findTarget(id).title, (v) => { findTarget(id).title = v; save(); render(); }));
      break;
    case 'del-target':
      if (confirm('Delete this weekly target? Linked tasks will be unlinked.')) {
        deleteTarget(id); save(); render();
      }
      break;
    case 'add-task':
      withEl((el2) => el2 && openInline(el2, '', (v) => {
        const plan = el.dataset.plan ? findPlan(el.dataset.plan) : getOrCreateWeekPlan(el.dataset.goal, curWeek);
        addTask(plan.id, el.dataset.date, v); save(); render();
      }));
      break;
    case 'edit-task':
      withEl((el2) => el2 && openInline(el2, findTask(id).text, (v) => { findTask(id).text = v; save(); render(); }));
      break;
    case 'del-task': deleteTask(id); save(); render(); break;
    case 'chip': chipOpenFor = chipOpenFor === id ? null : id; render(); break;
    case 'chip-pick': {
      const t = findTask(el.dataset.task);
      if (t) { t.targetId = el.dataset.target || undefined; save(); }
      chipOpenFor = null; render(); break;
    }

    case 'explore-add': editExploreItem(); break;
    case 'explore-edit': editExploreItem(id); break;
    case 'explore-delete': {
      if(confirm('Remove this item from Explore & Later?')){state.exploreItems=state.exploreItems.filter(x=>x.id!==id);save();render();}break;
    }
    case 'bucket-add': editBucketItem(); break;
    case 'bucket-edit': editBucketItem(id); break;
    case 'bucket-delete': {
      if(confirm('Remove this item from your bucket list?')){state.bucketItems=state.bucketItems.filter(x=>x.id!==id);save();render();}break;
    }
    case 'habit-add': {
      menuOpen = false;
      const hid = uid();
      state.habits.push({ id: hid, name: '', order: state.habits.length, manual: {} });
      save(); render();
      const nameEl = app.querySelector(`[data-action="habit-edit"][data-id="${hid}"]`);
      if (nameEl) { nameEl.scrollIntoView({ block: 'center' }); openInline(nameEl, '',
        (v) => { findHabit(hid).name = v; save(); render(); },
        () => { deleteHabit(hid); save(); render(); }); }
      break;
    }
    case 'habit-edit':
      withEl((el2) => el2 && openInline(el2, findHabit(id).name, (v) => { findHabit(id).name = v; save(); render(); }));
      break;
    case 'habit-del':
      if (confirm(`Delete habit "${findHabit(id).name}"?`)) { deleteHabit(id); save(); render(); }
      break;
    case 'habit-link': linkFor = linkFor === id ? null : id; render(); break;
    case 'habit-link-pick': {
      const h = findHabit(id);
      if (h) { h.categoryId = el.dataset.cat || undefined; save(); }
      linkFor = null; render(); break;
    }
    case 'habit-toggle': {
      const h = findHabit(id);
      if (h && !habitAuto(h, el.dataset.date)) {
        h.manual = h.manual || {};
        if (h.manual[el.dataset.date]) delete h.manual[el.dataset.date];
        else h.manual[el.dataset.date] = true;
        save(); render();
      }
      break;
    }
  }
});

app.addEventListener('change', (e) => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  if (el.dataset.change === 'explore-done') { const item=state.exploreItems.find(x=>x.id===el.dataset.id); if(!item)return; item.done=el.checked; save(); render(); return; }
  if (el.dataset.change === 'bucket-done') { const item=state.bucketItems.find(x=>x.id===el.dataset.id); if(!item)return; item.done=el.checked; save(); render(); return; }
  const t = el.dataset.change === 'task-done' ? findTask(el.dataset.id) : findTarget(el.dataset.id);
  if (!t) return;
  if (el.dataset.change === 'task-done') t.done = el.checked;
  else t.manualDone = el.checked;
  save(); render();
});

  }
});

  if (inlineOpen) return;
  const t = e.touches[0];
  swipeX = t.clientX; swipeY = t.clientY;
}, { passive: true });
app.addEventListener('touchend', (e) => {
  if (inlineOpen || !mqPhone.matches || state.view !== 'goals') return;
  const t = e.changedTouches[0];
  const dx = t.clientX - swipeX, dy = t.clientY - swipeY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
    const wd = weekDays(curWeek);
    const i = wd.indexOf(curDay);
    if (dx < 0) {
      if (i < 6) curDay = wd[i + 1];
      else { curWeek = toISODate(addDays(parseISO(curWeek), 7)); curDay = weekDays(curWeek)[0]; }
    } else {
      if (i > 0) curDay = wd[i - 1];
      else { curWeek = toISODate(addDays(parseISO(curWeek), -7)); curDay = weekDays(curWeek)[5]; }
    }
    render();
  }
}, { passive: true });

// Hover a target -> highlight its linked tasks (no re-render).
app.addEventListener('mouseover', (e) => {
  const t = e.target.closest('.target[data-tid]');
  if (!t) return;
  app.querySelectorAll(`.task[data-tid="${CSS.escape(t.dataset.tid)}"]`).forEach((n) => n.classList.add('hl'));
});
app.addEventListener('mouseout', (e) => {
  const t = e.target.closest('.target[data-tid]');
  if (!t) return;
  app.querySelectorAll(`.task[data-tid="${CSS.escape(t.dataset.tid)}"]`).forEach((n) => n.classList.remove('hl'));
});

/* ---------------- export / import ---------------- */
function doExport() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'goal-tracker-export.json';
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('importFile').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (confirm('Importing will replace ALL current data. Continue?')) {
      state = { monthGoals: [], weekPlans: [], weekTargets: [], dayTasks: [], habits: [], exploreItems: [], bucketItems: [], bucketCategories: [], view: 'goals', ...data };
      if (!Array.isArray(state.habits)) state.habits = [];
      if (!Array.isArray(state.exploreItems)) state.exploreItems = [];
      if (!Array.isArray(state.bucketItems)) state.bucketItems = [];
      if (!Array.isArray(state.bucketCategories)) state.bucketCategories = [];
      if (!['habits','explore','bucket'].includes(state.view)) state.view = 'goals';
      ensureCategories();
      menuOpen = false;
      save(); render();
    }
  } catch (err) {
    alert('Could not read that file: ' + err.message);
  }
});

/* ---------------- PWA: only over http(s), never on file:// ---------------- */
if (location.protocol === 'http:' || location.protocol === 'https:') {
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = 'manifest.webmanifest';
  document.head.appendChild(link);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    installEvt = e;
    render();
  });
  window.addEventListener('appinstalled', () => { installEvt = null; render(); });
}

render();
</script>
